<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência em Odds</title>
    <style>
        * { box-sizing: border-box; transition: 0.3s ease; font-family: 'Inter', -apple-system, sans-serif; }
        body { 
            background: #000000; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .app-card { 
            background: #0a0a0a; 
            width: 100%; 
            max-width: 420px; 
            padding: 40px 30px; 
            border-radius: 35px; 
            border: 2px solid #00ff88; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
            text-align: center;
        }
        .logo { 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: -1px; 
            margin-bottom: 40px; 
            color: #00ff88; 
        }
        .logo span { color: #fff; font-weight: 300; }
        
        .input-group { text-align: left; margin-bottom: 25px; }
        label { 
            display: block; 
            font-size: 10px; 
            color: #444; 
            font-weight: 800; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        input, select { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 15px; 
            padding: 18px; 
            width: 100%; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
        }
        input:focus, select:focus { border-color: #00ff88; }
        
        .btn-analyze { 
            background: #00ff88; 
            color: #000; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            border-radius: 18px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 15px; 
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }

        #result-area { display: none; margin-top: 40px; animation: fadeIn 0.6s ease; }
        
        .circle-container { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; }
        .circle-bg { fill: none; stroke: #1a1a1a; stroke-width: 10; }
        .circle-progress { 
            fill: none; 
            stroke: #00ff88; 
            stroke-width: 10; 
            stroke-linecap: round; 
            stroke-dasharray: 408; 
            stroke-dashoffset: 408; 
            transform: rotate(-90deg); 
            transform-origin: 50% 50%; 
            transition: 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .percentage { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 28px; 
            font-weight: 900; 
            color: #00ff88; 
        }

        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        .analysis-text { color: #888; font-size: 14px; line-height: 1.6; text-align: center; }

        .loader { width: 18px; height: 18px; border: 3px solid #000; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
        .error-msg { color: #ff4444; font-size: 12px; margin-top: 15px; display: none; text-align: center; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="logo">NATIVE <span>STATS</span></div>

    <div class="input-group">
        <label>Modalidade</label>
        <select id="sport">
            <option value="futebol">Futebol</option>
            <option value="basquete">Basquete</option>
            <option value="volei">Vôlei</option>
            <option value="esports">eSports</option>
        </select>
    </div>

    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Flamengo vs Vasco">
    </div>

    <div class="input-group">
        <label>Linha da Superbet</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>

    <button class="btn-analyze" id="btn-action" onclick="runAnalysis()">
        <span id="btn-text">Analisar Probabilidade</span>
        <div class="loader" id="btn-loader"></div>
    </button>

    <div id="error-box" class="error-msg"></div>

    <div id="result-area">
        <div class="circle-container">
            <svg width="140" height="140">
                <circle class="circle-bg" cx="70" cy="70" r="65"></circle>
                <circle id="bar" class="circle-progress" cx="70" cy="70" r="65"></circle>
            </svg>
            <div class="percentage" id="perc">0%</div>
        </div>

        <div class="veredito-label" id="veredito"></div>
        <p class="analysis-text" id="desc"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const apiKey = "";
    let auth = null;

    const initFirebase = async () => {
        try {
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (configStr) {
                const app = initializeApp(JSON.parse(configStr));
                auth = getAuth(app);
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) { await signInWithCustomToken(auth, token); } 
                else { await signInAnonymously(auth); }
            }
        } catch (e) { console.error("Falha na autenticação."); }
    };

    const callAI = async (prompt) => {
        const delays = [1000, 2000, 4000, 8000];
        for (let i = 0; i < delays.length; i++) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    probabilidade: { type: "NUMBER" },
                                    veredito: { type: "STRING" },
                                    analise: { type: "STRING" },
                                    status: { type: "STRING" }
                                }
                            }
                        }
                    })
                });
                if (!response.ok) throw new Error();
                const json = await response.json();
                return JSON.parse(json.candidates[0].content.parts[0].text);
            } catch (err) {
                if (i === delays.length - 1) throw new Error("Erro de conexão. Tente novamente.");
                await new Promise(r => setTimeout(r, delays[i]));
            }
        }
    };

    window.runAnalysis = async () => {
        const teams = document.getElementById('teams').value.trim();
        const lineInput = document.getElementById('line').value.trim();
        const sport = document.getElementById('sport').value;
        const btn = document.getElementById('btn-action');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('btn-loader');
        const resultArea = document.getElementById('result-area');
        const errorBox = document.getElementById('error-box');

        const cleanLine = parseFloat(lineInput.replace(/[^0-9.]/g, ''));

        if (!teams || isNaN(cleanLine)) {
            errorBox.innerText = "Preencha os dados corretamente.";
            errorBox.style.display = 'block';
            return;
        }

        errorBox.style.display = 'none';
        resultArea.style.display = 'none';
        btn.disabled = true;
        btnText.style.display = 'none';
        loader.style.display = 'block';

        const prompt = `Analise profissionalmente o confronto ${teams} no esporte ${sport} para a linha ${lineInput}. 
        Estamos em março de 2026. Use dados táticos atuais e médias nativas. 
        Importante: Não use as palavras cenário, utilizar, revolucionar ou vislumbre. 
        Escreva de forma direta e ativa. 
        Retorne JSON com probabilidade (0-100), veredito (frase curta), analise (parecer técnico direto em parágrafo único) e status (FAVORAVEL, MODERADO ou RISCO).`;

        try {
            const data = await callAI(prompt);
            
            resultArea.style.display = 'block';
            document.getElementById('veredito').innerText = `Veredito: ${data.veredito}`;
            document.getElementById('desc').innerText = data.analise;
            document.getElementById('perc').innerText = `${data.probabilidade}%`;

            const circle = document.getElementById('bar');
            const circumference = 408; 
            circle.style.strokeDasharray = circumference;
            const offset = circumference - (circumference * data.probabilidade) / 100;

            if (data.status === 'FAVORAVEL') circle.style.stroke = "#00ff88";
            else if (data.status === 'MODERADO') circle.style.stroke = "#ffbb00";
            else circle.style.stroke = "#ff4444";

            setTimeout(() => {
                circle.style.strokeDashoffset = offset;
            }, 100);

            resultArea.scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            errorBox.innerText = err.message;
            errorBox.style.display = 'block';
        } finally {
            btn.disabled = false;
            btnText.style.display = 'block';
            loader.style.display = 'none';
        }
    };

    window.addEventListener('DOMContentLoaded', initFirebase);
</script>

</body>
</html>
