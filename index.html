<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; transition: 0.3s ease; }
        body { 
            background: #000; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .app-card { 
            background: #0a0a0a; 
            width: 100%; 
            max-width: 400px; 
            padding: 35px; 
            border-radius: 30px; 
            border: 2px solid #00ff88; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 30px; color: #00ff88; letter-spacing: -1px; }
        .logo span { color: #fff; font-weight: 300; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 10px; color: #444; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #00ff88; }
        
        .btn-analyze { 
            background: #00ff88; 
            color: #000; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 15px; 
            font-weight: 900; 
            font-size: 14px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }
        .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-secondary {
            background: #1a1a1a;
            color: #00ff88;
            border: 1px solid #333;
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .btn-secondary:hover:not(:disabled) { background: #222; border-color: #00ff88; }

        #result-area { display: none; margin-top: 35px; animation: fadeIn 0.6s ease; }
        .circle-container { position: relative; width: 130px; height: 130px; margin: 0 auto 20px; }
        .circle-bg { fill: none; stroke: #1a1a1a; stroke-width: 10; }
        .circle-progress { 
            fill: none; 
            stroke: #00ff88; 
            stroke-width: 10; 
            stroke-linecap: round;
            stroke-dasharray: 376.99; 
            stroke-dashoffset: 376.99; 
            transform: rotate(-90deg); 
            transform-origin: 50% 50%; 
            transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 900; color: #00ff88; }
        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; }
        .analysis-text { color: #777; font-size: 13px; line-height: 1.5; text-align: justify; margin-bottom: 20px; }
        
        .ai-features {
            border-top: 1px solid #222;
            padding-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .loader { width: 16px; height: 16px; border: 2px solid #000; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; margin: 0 auto; }
        .error-msg { color: #ff4444; font-size: 11px; margin-top: 10px; display: none; padding: 10px; background: rgba(255,0,0,0.1); border-radius: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="logo">NATIVE STATS</div>
    
    <div class="input-group">
        <label>Modalidade</label>
        <select id="sport">
            <option value="futebol">Futebol</option>
            <option value="basquetebol">Basquetebol</option>
            <option value="volei">Vólei</option>
            <option value="esports">eSports</option>
        </select>
    </div>

    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Newcastle vs Chelsea">
    </div>

    <div class="input-group">
        <label>Linha</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>

    <button class="btn-analyze" id="btn-action">
        <span id="btn-text">Analisar Probabilidade</span>
        <div class="loader" id="btn-loader"></div>
    </button>

    <div id="error-box" class="error-msg"></div>

    <div id="result-area">
        <div class="circle-container">
            <svg width="130" height="130">
                <circle class="circle-bg" cx="65" cy="65" r="60"></circle>
                <circle id="bar" class="circle-progress" cx="65" cy="65" r="60"></circle>
            </svg>
            <div class="percentage" id="perc">0%</div>
        </div>
        <div class="veredito-label" id="veredito"></div>
        <p class="analysis-text" id="desc"></p>

        <div class="ai-features">
            <button class="btn-secondary" id="btn-suggest">✨ Alternativa</button>
            <button class="btn-secondary" id="btn-tts">✨ Ouvir</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const apiKey = "";
    let auth = null;
    let user = null;

    const initApp = async () => {
        try {
            // Proteção para o GitHub: verifica se as globais existem
            const hasFirebase = typeof __firebase_config !== 'undefined';
            const config = hasFirebase ? JSON.parse(__firebase_config) : null;

            if (config) {
                const app = initializeApp(config);
                auth = getAuth(app);
                
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (u) => { user = u; });
            } else {
                // Caso esteja no GitHub, define um utilizador padrão para não travar
                user = { uid: "external-user" };
            }
        } catch (e) {
            console.warn("Ambiente externo detectado.");
            user = { uid: "local-user" };
        }
    };

    const callAI = async (prompt) => {
        let retries = 0;
        const maxRetries = 5;
        
        while (retries < maxRetries) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    probabilidade: { type: "NUMBER" },
                                    veredito: { type: "STRING" },
                                    analise: { type: "STRING" },
                                    status: { type: "STRING" }
                                }
                            }
                        }
                    })
                });
                
                if (!response.ok) throw new Error();
                const json = await response.json();
                let content = json.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!content) throw new Error();
                
                content = content.replace(/```json|```/g, "").trim();
                return JSON.parse(content);
            } catch (err) {
                retries++;
                const delay = Math.pow(2, retries) * 1000;
                await new Promise(r => setTimeout(r, delay));
            }
        }
        throw new Error("Erro de ligação. Verifique a sua internet.");
    };

    function pcmToWav(pcmData, sampleRate) {
        const buffer = new ArrayBuffer(44 + pcmData.length * 2);
        const view = new DataView(buffer);
        const writeString = (offset, string) => {
            for (let i = 0; i < string.length; i++) { view.setUint8(offset + i, string.charCodeAt(i)); }
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + pcmData.length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, pcmData.length * 2, true);
        for (let i = 0; i < pcmData.length; i++) { view.setInt16(44 + i * 2, pcmData[i], true); }
        return buffer;
    }

    const speakAnalysis = async () => {
        const btn = document.getElementById('btn-tts');
        const textToSpeak = document.getElementById('desc').innerText;
        if (!textToSpeak) return;

        btn.disabled = true;
        btn.innerText = "✨ Áudio...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: textToSpeak }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } }
                        }
                    }
                })
            });

            if (!response.ok) throw new Error();
            const result = await response.json();
            const audioPart = result.candidates[0].content.parts[0].inlineData;
            const audioData = audioPart.data.replace(/\s/g, '');
            const binaryString = atob(audioData);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }

            const dataView = new DataView(bytes.buffer);
            const pcmData = new Int16Array(len / 2);
            // Ganho calibrado para áudio limpo
            for (let i = 0; i < pcmData.length; i++) {
                pcmData[i] = Math.round(dataView.getInt16(i * 2, false) * 0.1);
            }

            const wavBuffer = pcmToWav(pcmData, 24000);
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
            audio.onended = () => {
                btn.disabled = false;
                btn.innerText = "✨ Ouvir";
            };
        } catch (err) {
            btn.disabled = false;
            btn.innerText = "✨ Falha";
        }
    };

    const runAnalysis = async () => {
        const t = document.getElementById('teams').value.trim();
        const l = document.getElementById('line').value.trim();
        const s = document.getElementById('sport').value;
        const btn = document.getElementById('btn-action');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('btn-loader');
        const resultArea = document.getElementById('result-area');
        const errorBox = document.getElementById('error-box');

        if (!t || !l) return;
        errorBox.style.display = 'none';
        resultArea.style.display = 'none';
        btn.disabled = true;
        btnText.style.display = 'none';
        loader.style.display = 'block';

        const prompt = `Analise o jogo ${t} em ${s} para a linha ${l} em março de 2026. Escreva de forma técnica e direta. Use voz ativa. Sem adjetivos irrelevantes.`;

        try {
            const data = await callAI(prompt);
            updateUI(data);
            resultArea.scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            errorBox.innerText = "Erro no processamento. Tente novamente.";
            errorBox.style.display = 'block';
        } finally {
            btn.disabled = false;
            btnText.style.display = 'block';
            loader.style.display = 'none';
        }
    };

    function updateUI(data) {
        const resultArea = document.getElementById('result-area');
        resultArea.style.display = 'block';
        document.getElementById('veredito').innerText = data.veredito;
        document.getElementById('desc').innerText = data.analise;
        document.getElementById('perc').innerText = `${data.probabilidade}%`;
        const circle = document.getElementById('bar');
        const circumference = 376.99;
        circle.style.strokeDasharray = circumference;
        const offset = circumference - (circumference * data.probabilidade) / 100;
        circle.style.stroke = "#00ff88"; 
        if (data.probabilidade < 70) circle.style.stroke = "#ffbb00";
        if (data.probabilidade < 50) circle.style.stroke = "#ff4444";
        setTimeout(() => { circle.style.strokeDashoffset = offset; }, 100);
    }

    window.addEventListener('DOMContentLoaded', () => {
        initApp();
        document.getElementById('btn-action').addEventListener('click', runAnalysis);
        document.getElementById('btn-suggest').addEventListener('click', runAnalysis);
        document.getElementById('btn-tts').addEventListener('click', speakAnalysis);
    });
</script>

</body>
</html>
