<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; transition: 0.2s; }
        body { background: #080808; color: #fff; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #111; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; border: 1px solid #222; }
        .logo { text-align: center; font-size: 24px; font-weight: 900; margin-bottom: 30px; color: #00ff88; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 10px; text-transform: uppercase; color: #666; margin-bottom: 5px; }
        input { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; width: 100%; color: #fff; font-size: 16px; }
        .btn { background: #00ff88; color: #000; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #result { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; text-align: center; font-weight: bold; }
        .green { border: 1px solid #00ff88; color: #00ff88; background: rgba(0,255,136,0.1); }
        .red { border: 1px solid #ff4444; color: #ff4444; background: rgba(255,68,68,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">NATIVE STATS</div>
        <div class="field">
            <label>Confronto</label>
            <input type="text" id="t" placeholder="Time A vs Time B">
        </div>
        <div class="field">
            <label>Linha Superbet (Pode colar o texto)</label>
            <input type="text" id="l" placeholder="Ex: Mais de 1.5">
        </div>
        <button class="btn" onclick="check()">ANALISAR</button>
        <div id="result"></div>
    </div>
    <script>
        function check() {
            const val = document.getElementById('l').value;
            const r = document.getElementById('result');
            
            // Extrai apenas os números e o ponto decimal do texto colado
            const num = parseFloat(val.replace(/[^0-9.]/g, ''));
            
            r.style.display = 'block';
            
            if (isNaN(num)) {
                r.className = 'red';
                r.innerHTML = "VALOR INVÁLIDO";
                return;
            }

            // Lógica para Gols (Linhas baixas) e Escanteios (Linhas altas)
            if (num <= 2.5 || (num > 7 && num <= 9.5)) {
                r.className = 'green';
                r.innerHTML = "✅ GREEN PROVÁVEL (" + num + ")";
            } else {
                r.className = 'red';
                r.innerHTML = "❌ RISCO ALTO (" + num + ")";
            }
        }
    </script>
</body>
</html>
