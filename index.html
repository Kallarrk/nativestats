<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: #0a0a0a; width: 95%; max-width: 400px; padding: 35px; border-radius: 30px; border: 2px solid #00ff88; text-align: center; }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 30px; color: #00ff88; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 10px; color: #444; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        input { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        .btn-analyze { background: #00ff88; color: #000; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        #result-area { display: none; margin-top: 35px; }
        .circle-container { position: absolute; width: 130px; height: 130px; margin-left: auto; margin-right: auto; left: 0; right: 0; }
        .percentage { font-size: 26px; font-weight: 900; color: #00ff88; margin-top: 45px; display: block; }
        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-top: 100px; margin-bottom: 12px; }
        .analysis-text { color: #777; font-size: 13px; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>
    <div class="app-card">
        <div class="logo">NATIVE STATS</div>
        <div class="input-group">
            <label>Confronto</label>
            <input type="text" id="teams" placeholder="Ex: Flamengo vs Vasco">
        </div>
        <div class="input-group">
            <label>Linha da Superbet</label>
            <input type="text" id="line" placeholder="Ex: Mais de 9.5">
        </div>
        <button class="btn-analyze" id="btn" onclick="analyze()">Analisar Probabilidade</button>
        <div id="result-area">
            <div style="height: 130px; position: relative;">
                <span class="percentage" id="perc">0%</span>
            </div>
            <div class="veredito-label" id="veredito"></div>
            <p class="analysis-text" id="desc"></p>
        </div>
    </div>
    <script>
        function analyze() {
            var t = document.getElementById('teams').value;
            var l = document.getElementById('line').value;
            var n = parseFloat(l.replace(/[^0-9.]/g, ''));
            if(!t || isNaN(n)) return;
            document.getElementById('btn').innerText = "PROCESSANDO...";
            document.getElementById('result-area').style.display = 'none';
            setTimeout(function() {
                document.getElementById('btn').innerText = "ANALISAR PROBABILIDADE";
                document.getElementById('result-area').style.display = 'block';
                var p = 75 + (t.length % 10);
                document.getElementById('perc').innerText = p + "%";
                document.getElementById('veredito').innerText = "Veredito: Over " + n + " Favorável";
                document.getElementById('desc').innerText = "O confronto entre " + t + " apresenta cenário tático favorável. A média suporta a linha de " + n + ".";
            }, 800);
        }
    </script>
</body>
</html>
