<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência em Odds</title>
    <style>
        * { box-sizing: border-box; transition: 0.3s ease; }
        body { background: #080808; color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #111; width: 95%; max-width: 450px; padding: 35px; border-radius: 28px; border: 1px solid #222; box-shadow: 0 40px 80px rgba(0,0,0,0.9); }
        .logo { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 30px; color: #00ff88; }
        .logo span { color: #fff; font-weight: 300; }
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #555; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
        input { background: #181818; border: 1px solid #282828; border-radius: 14px; padding: 18px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #00ff88; }
        .btn-check { background: #00ff88; color: #000; border: none; padding: 20px; width: 100%; border-radius: 16px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        #panel-result { margin-top: 30px; display: none; animation: fadeIn 0.5s ease; }
        .result-box { background: rgba(0, 255, 136, 0.03); border: 1px solid #00ff88; border-radius: 20px; padding: 25px; }
        .prob-value { font-size: 32px; font-weight: 900; color: #00ff88; margin: 10px 0; display: block; }
        .veridito-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 15px; }
        .ia-text { font-size: 14px; color: #aaa; line-height: 1.6; text-align: justify; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">NATIVE<span>STATS</span></div>

        <div class="field">
            <label>Confronto</label>
            <input type="text" id="teams" placeholder="Ex: Bragantino vs São Paulo">
        </div>

        <div class="field">
            <label>Linha da Superbet</label>
            <input type="text" id="market_line" placeholder="Ex: Mais de 9.5">
        </div>

        <button class="btn-check" onclick="runAnalysis()">Analisar Probabilidade</button>

        <div id="panel-result">
            <div class="result-box">
                <div class="veridito-title" id="v-title"></div>
                <span class="prob-value" id="v-prob"></span>
                <div class="ia-text" id="v-desc"></div>
            </div>
        </div>
    </div>

<script>
    function runAnalysis() {
        const teams = document.getElementById('teams').value;
        const rawLine = document.getElementById('market_line').value;
        const panel = document.getElementById('panel-result');
        
        const line = parseFloat(rawLine.replace(/[^0-9.]/g, ''));
        if(!teams || isNaN(line)) return;

        panel.style.display = 'block';
        
        // Simulação de Inteligência Preditiva
        const prob = Math.floor(Math.random() * (82 - 62 + 1)) + 62; 
        const status = line <= 9.5 ? "Favorável" : "Risco Moderado";
        
        document.getElementById('v-title').innerHTML = `Veredito: Over ${line} ${status}`;
        document.getElementById('v-prob').innerHTML = `${prob}% DE PROBABILIDADE`;
        
        document.getElementById('v-desc').innerHTML = `O confronto entre ${teams} em março de 2026 apresenta um cenário tático favorável para estatísticas nativas. A equipe mandante mantém filosofia de pressão alta e verticalidade, resultando em alto volume de jogadas de fundo. O adversário utiliza alas para dar amplitude, gerando transições que forçam a linha de ${line}. A média somada das equipes na temporada atual é superior à marca estabelecida, com alto índice de aproveitamento em mercados similares.`;
    }
</script>

</body>
</html>
