<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { 
            background: #000000; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .app-card { 
            background: #0a0a0a; 
            width: 95%; 
            max-width: 420px; 
            padding: 40px 30px; 
            border-radius: 35px; 
            border: 2px solid #00ff88; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            text-align: center;
        }
        .logo { 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: -1px; 
            margin-bottom: 40px; 
            color: #00ff88; 
        }
        .logo span { color: #fff; font-weight: 300; }
        
        .input-group { text-align: left; margin-bottom: 25px; }
        label { 
            display: block; 
            font-size: 10px; 
            color: #444; 
            font-weight: 800; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        input { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 15px; 
            padding: 18px; 
            width: 100%; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
        }
        input:focus { border-color: #00ff88; }
        
        .btn-analyze { 
            background: #00ff88; 
            color: #000; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            border-radius: 18px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 15px; 
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #result-area { display: none; margin-top: 40px; animation: fadeIn 0.6s ease; }
        
        /* Círculo de Probabilidade Estilo Imagem */
        .circle-container { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; }
        .circle-bg { fill: none; stroke: #1a1a1a; stroke-width: 10; }
        .circle-progress { 
            fill: none; 
            stroke: #00ff88; 
            stroke-width: 10; 
            stroke-linecap: round; 
            stroke-dasharray: 440; 
            stroke-dashoffset: 440; 
            transform: rotate(-90deg); 
            transform-origin: 50% 50%; 
            transition: 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .percentage { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 28px; 
            font-weight: 900; 
            color: #00ff88; 
        }

        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .analysis-text { color: #666; font-size: 14px; line-height: 1.6; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="logo">NATIVE<span>STATS</span></div>

    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Bragantino vs São Paulo">
    </div>

    <div class="input-group">
        <label>Linha da Superbet</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>

    <button class="btn-analyze" onclick="analyze()">Analisar Probabilidade</button>

    <div id="result-area">
        <div class="circle-container">
            <svg width="140" height="140">
                <circle class="circle-bg" cx="70" cy="70" r="65"></circle>
                <circle id="bar" class="circle-progress" cx="70" cy="70" r="65"></circle>
            </svg>
            <div class="percentage" id="perc">0%</div>
        </div>

        <div class="veredito-label" id="veredito"></div>
        <p class="analysis-text" id="desc"></p>
    </div>
</div>

<script>
    function analyze() {
        const teamsInput = document.getElementById('teams').value.trim();
        const lineInput = document.getElementById('line').value;
        const resultArea = document.getElementById('result-area');
        
        const lineValue = parseFloat(lineInput.replace(/[^0-9.]/g, ''));
        if(!teamsInput || isNaN(lineValue)) return;

        resultArea.style.display = 'block';
        
        // Gerador de Probabilidade Fixa pelo nome do time
        let seed = 0;
        for (let i = 0; i < teamsInput.length; i++) seed += teamsInput.charCodeAt(i);
        const prob = 60 + (seed % 26); // Gera entre 60% e 85%
        
        // Animação do Círculo (Circunferência 2 * PI * r = 2 * 3.14 * 65 ≈ 408)
        const circle = document.getElementById('bar');
        const circumference = 2 * Math.PI * 65;
        circle.style.strokeDasharray = circumference;
        const offset = circumference - (circumference * prob) / 100;
        
        // Delay pequeno para a animação disparar
        setTimeout(() => {
            circle.style.strokeDashoffset = offset;
        }, 100);
        
        document.getElementById('perc').innerHTML = prob + "%";
        document.getElementById('veredito').innerHTML = `Veredito: Over ${lineValue} Favorável`;
        document.getElementById('desc').innerHTML = `O confronto entre ${teamsInput} apresenta um cenário tático favorável para o mercado de estatísticas nativas. A média somada das equipes na temporada atual é de ${ (lineValue + 1.2).toFixed(1) } por partida, com alto índice de aproveitamento acima da marca de ${lineValue}.`;
    }
</script>

</body>
</html>
