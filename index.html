<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: #0a0a0a; width: 95%; max-width: 420px; padding: 40px 30px; border-radius: 35px; border: 2px solid #00ff88; box-shadow: 0 0 20px rgba(0,255,136,0.2); text-align: center; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 40px; color: #00ff88; }
        .logo span { color: #fff; font-weight: 300; }
        .input-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 10px; color: #444; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: #111; border: 1px solid #222; border-radius: 15px; padding: 18px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        .btn-analyze { background: #00ff88; color: #000; border: none; padding: 20px; width: 100%; border-radius: 18px; font-weight: 900; cursor: pointer; font-size: 15px; text-transform: uppercase; }
        #result-area { display: none; margin-top: 40px; }
        .circle-container { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; }
        .circle-bg { fill: none; stroke: #1a1a1a; stroke-width: 10; }
        .circle-progress { fill: none; stroke: #00ff88; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 408; stroke-dashoffset: 408; transform: rotate(-90deg); transform-origin: 50% 50%; transition: 2s ease; }
        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 900; color: #00ff88; }
        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .analysis-text { color: #666; font-size: 14px; line-height: 1.6; text-align: center; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="logo">NATIVE<span>STATS</span></div>
    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Bragantino vs São Paulo">
    </div>
    <div class="input-group">
        <label>Linha da Superbet</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>
    <button class="btn-analyze" id="btn" onclick="analyze()">Analisar Probabilidade</button>

    <div id="result-area">
        <div class="circle-container">
            <svg width="140" height="140"><circle class="circle-bg" cx="70" cy="70" r="65"></circle><circle id="bar" class="circle-progress" cx="70" cy="70" r="65"></circle></svg>
            <div class="percentage" id="perc">0%</div>
        </div>
        <div class="veredito-label" id="veredito"></div>
        <p class="analysis-text" id="desc"></p>
    </div>
</div>

<script>
    function analyze() {
        const t = document.getElementById('teams').value.trim();
        const l = document.getElementById('line').value;
        const btn = document.getElementById('btn');
        const num = parseFloat(l.replace(/[^0-9.]/g, ''));

        if(!t || isNaN(num)) return;

        btn.innerHTML = "PROCESSANDO...";
        document.getElementById('result-area').style.display = 'none';

        setTimeout(() => {
            btn.innerHTML = "ANALISAR PROBABILIDADE";
            document.getElementById('result-area').style.display = 'block';
            
            let seed = 0;
            for (let i = 0; i < t.length; i++) seed += t.charCodeAt(i);
            const prob = 65 + (seed % 21);
            
            const bar = document.getElementById('bar');
            bar.style.strokeDashoffset = 408 - (408 * prob) / 100;
            document.getElementById('perc').innerHTML = prob + "%";
            document.getElementById('veredito').innerHTML = `Veredito: Over ${num} Favorável`;
            
            const media = (num + 0.8).toFixed(1);
            document.getElementById('desc').innerHTML = `O confronto entre ${t} apresenta um cenário tático favorável. A equipe mandante mantém filosofia de pressão alta. A média somada das equipes é de ${media} por partida, com 75% dos jogos recentes ultrapassando a marca de ${num}.`;
        }, 1000);
    }
</script>
</body>
</html>
