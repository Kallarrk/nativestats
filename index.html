<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0b0b; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: #141414; width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; border: 1px solid #222; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -1px; margin: 0; color: #00ff88; }
        .header span { color: #fff; font-weight: 300; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #555; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        input { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; padding: 15px; width: 100%; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #00ff88; }
        
        .btn-analyze { background: #00ff88; color: #000; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 14px; text-transform: uppercase; }

        #result-area { display: none; margin-top: 30px; text-align: center; border-top: 1px solid #222; padding-top: 25px; }
        
        /* Círculo de Probabilidade */
        .circle-container { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .circle-bg { fill: none; stroke: #222; stroke-width: 8; }
        .circle-progress { fill: none; stroke: #00ff88; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 314; stroke-dashoffset: 314; transform: rotate(-90deg); transform-origin: 50% 50%; transition: 1.5s ease-out; }
        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: 900; color: #00ff88; }

        .status-badge { display: inline-block; background: rgba(0, 255, 136, 0.1); color: #00ff88; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 15px; }
        .analysis-text { color: #888; font-size: 13px; line-height: 1.6; text-align: justify; margin: 0; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>NATIVE<span>STATS</span></h1>
    </div>

    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Flamengo vs Vasco">
    </div>

    <div class="input-group">
        <label>Linha da Superbet</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>

    <button class="btn-analyze" onclick="analyze()">Analisar Probabilidade</button>

    <div id="result-area">
        <div class="status-badge" id="status">✓ VERIFICADO</div>
        
        <div class="circle-container">
            <svg width="120" height="120">
                <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                <circle id="bar" class="circle-progress" cx="60" cy="60" r="50"></circle>
            </svg>
            <div class="percentage" id="perc">0%</div>
        </div>

        <div id="veredito" style="font-weight: 800; margin-bottom: 10px; font-size: 16px;"></div>
        <p class="analysis-text" id="desc"></p>
    </div>
</div>

<script>
    function analyze() {
        const teams = document.getElementById('teams').value.trim();
        const rawLine = document.getElementById('line').value;
        const resultArea = document.getElementById('result-area');
        
        const lineValue = parseFloat(rawLine.replace(/[^0-9.]/g, ''));
        if(!teams || isNaN(lineValue)) return;

        resultArea.style.display = 'block';
        
        // Gera valor fixo baseado no nome
        let seed = 0;
        for (let i = 0; i < teams.length; i++) seed += teams.charCodeAt(i);
        const prob = 65 + (seed % 21);
        
        // Animação do círculo
        const circle = document.getElementById('bar');
        const offset = 314 - (314 * prob) / 100;
        circle.style.strokeDashoffset = offset;
        
        // Texto e Porcentagem
        document.getElementById('perc').innerHTML = prob + "%";
        document.getElementById('veredito').innerHTML = `Veredito: Over ${lineValue} Favorável`;
        document.getElementById('desc').innerHTML = `O confronto entre ${teams} em março de 2026 apresenta um cenário tático favorável para escanteios. O mandante mantém pressão alta e verticalidade, resultando em alto volume de jogadas de fundo. O visitante utiliza alas para dar amplitude, gerando cantos em transições. A média das equipes suporta o índice de ${prob}% de sucesso.`;
    }
</script>

</body>
</html>
