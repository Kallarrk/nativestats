<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeStats | Inteligência</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; transition: 0.3s ease; }
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-card { background: #0a0a0a; width: 100%; max-width: 400px; padding: 35px; border-radius: 30px; border: 2px solid #00ff88; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 136, 0.1); }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 30px; color: #00ff88; letter-spacing: -1px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 10px; color: #444; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        .btn-analyze { background: #00ff88; color: #000; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        #result-area { display: none; margin-top: 35px; }
        .circle-container { position: relative; width: 130px; height: 130px; margin: 0 auto 20px; }
        .circle-bg { fill: none; stroke: #1a1a1a; stroke-width: 10; }
        .circle-progress { fill: none; stroke: #00ff88; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 900; color: #00ff88; }
        .veredito-label { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 12px; }
        .analysis-text { color: #777; font-size: 13px; line-height: 1.5; text-align: center; margin-bottom: 20px; }
        .ai-features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #222; padding-top: 15px; }
        .btn-secondary { background: #1a1a1a; color: #00ff88; border: 1px solid #333; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="logo">NATIVE STATS</div>
    
    <div class="input-group">
        <label>Modalidade</label>
        <select id="sport">
            <option value="Futebol">Futebol</option>
            <option value="Basquete">Basquete</option>
            <option value="eSports">eSports</option>
        </select>
    </div>

    <div class="input-group">
        <label>Confronto</label>
        <input type="text" id="teams" placeholder="Ex: Flamengo vs Vasco">
    </div>

    <div class="input-group">
        <label>Linha</label>
        <input type="text" id="line" placeholder="Ex: Mais de 9.5">
    </div>

    <button class="btn-analyze" onclick="runAnalysis()">Analisar Probabilidade</button>

    <div id="result-area">
        <div class="circle-container">
            <svg width="130" height="130">
                <circle class="circle-bg" cx="65" cy="65" r="60"></circle>
                <circle id="bar" class="circle-progress" cx="65" cy="65" r="60"></circle>
            </svg>
            <div class="percentage" id="perc">0%</div>
        </div>
        <div class="veredito-label" id="veredito"></div>
        <p class="analysis-text" id="desc"></p>

        <div class="ai-features">
            <button class="btn-secondary" onclick="alert('Sugestão: Tente uma linha 0.5 abaixo para maior segurança.')">✨ Alternativa</button>
            <button class="btn-secondary" onclick="speakText()">✨ Ouvir</button>
        </div>
    </div>
</div>

<script>
    function runAnalysis() {
        const teams = document.getElementById('teams').value;
        const line = document.getElementById('line').value;
        const num = parseFloat(line.replace(/[^0-9.]/g, ''));

        if (!teams || isNaN(num)) {
            alert("Preencha os dados corretamente.");
            return;
        }

        document.getElementById('result-area').style.display = 'block';
        
        // Simulação de IA estável
        const prob = 70 + (teams.length % 15);
        const offset = 377 - (377 * prob) / 100;
        
        document.getElementById('bar').style.strokeDashoffset = offset;
        document.getElementById('perc').innerText = prob + "%";
        document.getElementById('veredito').innerText = "Veredito: Over " + num + " Favorável";
        
        const media = (num + 0.7).toFixed(1);
        document.getElementById('desc').innerText = "A análise para " + teams + " indica um padrão estatístico sólido para 2026. A média somada das equipes é de " + media + " por jogo, validando a entrada na linha de " + num + ".";
    }

    function speakText() {
        const text = document.getElementById('desc').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'pt-BR';
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
